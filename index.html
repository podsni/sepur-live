<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sepur Live · Peta langsung kereta api Indonesia</title>
<meta name="description" content="Peta langsung, jadwal lengkap, dan perencana perjalanan kereta api Indonesia: KRL, MRT, LRT, KA Bandara, Whoosh, dan KA antarkota Jawa. Posisi kereta dihitung dari jadwal di atas rel OpenStreetMap.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:title" content="Sepur Live">
<meta property="og:description" content="Peta langsung kereta api Indonesia, menurut jadwal.">
<link rel="preload" href="/data/network.json" as="fetch" crossorigin>
<link rel="preload" href="/data/trips.json" as="fetch" crossorigin>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></symbol>
<symbol id="i-xc" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm3.3 5.3L12 10.6 8.7 7.3 7.3 8.7l3.3 3.3-3.3 3.3 1.4 1.4 3.3-3.3 3.3 3.3 1.4-1.4-3.3-3.3 3.3-3.3z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6L8 12l7.4 7.4L14 20.8 5.2 12 14 3.2z"/></symbol>

<symbol id="i-locate" viewBox="0 0 24 24"><path d="M11 2h2v2.07A8 8 0 0 1 19.93 11H22v2h-2.07A8 8 0 0 1 13 19.93V22h-2v-2.07A8 8 0 0 1 4.07 13H2v-2h2.07A8 8 0 0 1 11 4.07zm1 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l10 5.5-10 5.5L2 7.5zm0 2.3L6.2 7.5 12 10.7l5.8-3.2zM4.1 11.3L12 15.6l7.9-4.3 2.1 1.2L12 18 2 12.5zm0 4.9L12 20.5l7.9-4.3 2.1 1.2L12 22.9 2 17.4z"/></symbol>

<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2l5 5-1.4 1.4L13 5.8V15h-2V5.8L8.4 8.4 7 7zM4 12h2v7h12v-7h2v9H4z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol>
<symbol id="i-follow" viewBox="0 0 24 24"><path d="M12 2l8 19-8-4-8 4z"/></symbol>

<div class="app" id="app" data-screen="peta" data-loading="">
  <div class="map" id="map" role="region" aria-label="Peta kereta"></div>

  <div class="ctrls" id="ctrls">
    <div class="ccard">
      <button type="button" class="c3d" id="b-3d" aria-pressed="false" aria-label="Tampilan 3D">3D</button>
      <button type="button" id="b-ug" aria-pressed="false" aria-label="Tampilan bawah tanah" title="Bawah tanah"><svg class="i"><use href="#i-ug"/></svg></button>
      <button type="button" id="b-layers" aria-pressed="false" aria-label="Pilih yang tampil di peta" title="Pilih yang tampil di peta"><svg class="i"><use href="#i-layers"/></svg></button>
      <button type="button" id="b-locate" aria-label="Lokasiku dan stasiun terdekat"><svg class="i"><use href="#i-locate"/></svg></button>
    </div>
    <div class="ccard czoom">
      <button type="button" id="b-zin" aria-label="Perbesar peta"><svg class="i"><use href="#i-plus"/></svg></button>
      <button type="button" id="b-zout" aria-label="Perkecil peta"><svg class="i"><use href="#i-minus"/></svg></button>
    </div>
  </div>
  <div class="simbar" id="simbar" hidden role="status"><svg class="i"><use href="#i-clock"/></svg><b id="sim-t"></b><span class="sp"><button type="button" data-speed="1">1×</button><button type="button" data-speed="10">10×</button><button type="button" data-speed="60">60×</button><button type="button" data-speed="300">300×</button></span><button type="button" class="now" data-act="sim-stop">Sekarang</button></div>
  <div class="layers" id="layers" hidden role="dialog" aria-label="Tampilan peta"></div>

  <aside class="pane" id="pane" aria-label="Sepur Live">
    <div class="grab" id="grab"><i class="grabber" aria-hidden="true"></i></div>
    <header class="phead">
      <button type="button" class="round back" data-act="back" aria-label="Kembali"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="ptitle"><h1 id="ptitle">Sepur Live</h1><span class="badge sched" id="live-badge" title="Posisi kereta dihitung dari jadwal">Menurut jadwal</span></div>
      <button type="button" class="round logo" data-act="about" aria-label="Tentang Sepur Live"><img src="/icon.svg" width="36" height="36" alt=""></button>
    </header>
    <div class="ptabs">
      <div class="seg" role="tablist" aria-label="Tampilan">
        <button type="button" role="tab" data-tab="peta" aria-selected="true">Peta</button>
        <button type="button" role="tab" data-tab="jalur" aria-selected="false">Jalur</button>
        <button type="button" role="tab" data-tab="rute" aria-selected="false">Rute</button>
        <button type="button" role="tab" data-tab="stasiun" aria-selected="false">Stasiun</button>
      </div>
    </div>
    <div class="pbody" id="pbody">
      <form class="search" id="search" role="search" autocomplete="off">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Cari stasiun, jalur, kereta, atau tempat" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Cari stasiun, jalur, kereta, atau tempat">
        <button type="button" class="qx" id="qx" aria-label="Hapus pencarian" hidden><svg class="i"><use href="#i-xc"/></svg></button>
      </form>
      <div class="banner" id="banner" role="status" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-warn"/></svg>
        <div><b id="banner-t">Kamu sedang offline</b><span id="banner-s">Jadwal tetap jalan dari data yang sudah dimuat.</span></div>
      </div>
      <div class="views" id="view"></div>
    </div>
    <footer class="pfoot"><button type="button" class="credit" data-act="about">Posisi kereta dihitung dari jadwal · Data peta © kontributor OpenStreetMap · Tidak berafiliasi dengan operator kereta</button></footer>
  </aside>

  <div class="loading" id="loading" role="status">
    <div class="lcard">
      <img class="lart" src="/icon.svg" width="96" height="96" alt="">
      <p class="lt" id="load-t">Menunggu kereta datang</p>
      <p class="ls" id="load-s">Menyiapkan peta dan jadwal KRL, MRT, LRT, KA Bandara, Whoosh, dan KA antarkota</p>
      <div class="ltrack"><i id="load-bar"></i></div>
      <button type="button" class="btn primary" id="load-retry" hidden>Coba lagi</button>
    </div>
  </div>

  <div class="sheet" id="about" hidden role="dialog" aria-modal="true" aria-label="Tentang Sepur Live"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<noscript><p class="nojs">Sepur Live butuh JavaScript untuk menampilkan peta.</p></noscript>
</body>
</html>
